name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint HTML
        run: npx htmlhint public/index.html public/color.html

      - name: Lint CSS
        run: npx stylelint public/css/styles.css

      - name: Lint JavaScript
        run: npx eslint public/js/code.js
